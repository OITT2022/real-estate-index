version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `npm install` (not `npm ci`) so the @swc/helpers override resolves
        # cleanly. Next pins @swc/helpers@0.5.15 in its manifest while
        # next-intl's @swc/core peer-deps >=0.5.17. The override deduplicates
        # both to 0.5.21 — `npm install` accepts that, `npm ci` rejects it
        # as "Missing: @swc/helpers@0.5.21 from lock file".
        - npm install --no-audit --no-fund
        - npx prisma generate
        - npx prisma migrate deploy || echo "Migration skipped (may need manual run)"
        - |
          printenv | grep -E '^(DATABASE_URL|NEXTAUTH_SECRET|NEXTAUTH_URL|PLATFORM|STORAGE_PROVIDER|ADMIN_SEED_EMAIL|ADMIN_SEED_PASSWORD|NEXT_PUBLIC_|S3_BUCKET|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|RESEND_|DEEPL_API_KEY)' > .env.production || true
        - echo "Generated .env.production with $(wc -l < .env.production) vars"
    build:
      commands:
        - npx next build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - node_modules/.prisma/**/*
