version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
        - npx prisma migrate deploy || echo "Migration skipped (may need manual run)"
        # Amplify doesn't reliably inject env vars into Next.js SSR runtime.
        # Write them to .env.production so Next.js picks them up at runtime.
        - |
          printenv | grep -E '^(DATABASE_URL|NEXTAUTH_SECRET|NEXTAUTH_URL|PLATFORM|STORAGE_PROVIDER|ADMIN_SEED_EMAIL|ADMIN_SEED_PASSWORD|NEXT_PUBLIC_|S3_BUCKET|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|RESEND_)' > .env.production || true
        - echo "Generated .env.production with $(wc -l < .env.production) vars"
    build:
      commands:
        - npm run build
        - echo "DEBUG DATABASE_URL set = $(if [ -n \"$DATABASE_URL\" ]; then echo YES; else echo NO; fi)"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
